name: TeamTalk5 Legacy Build (JAR Cleaner Fix)

on: 
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true 

    # 2. Setup Java 17 (WAJIB untuk sdkmanager)
    - name: Set up JDK 17 for SDK Tools
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Setup Android SDK MANUAL
    - name: Install Android SDK Manually
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true
        
        sdkmanager --sdk_root=$ANDROID_HOME \
          "platform-tools" \
          "platforms;android-29" \
          "build-tools;29.0.3"
          
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    # 4. SWITCH KE JAVA 11
    - name: Switch to JDK 11 for Legacy Compilation
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 5. FIND, COPY & CLEAN JAR (FIX DESUGAR ERROR)
    - name: Find, Copy & Clean TeamTalk5.jar
      run: |
        echo "🔍 Searching for TeamTalk5.jar..."
        JAR_PATH=$(find . -iname "TeamTalk5.jar" -type f | head -n 1)
        
        if [ -z "$JAR_PATH" ]; then
          echo " FATAL: TeamTalk5.jar NOT FOUND!"
          exit 1
        fi
        
        echo "✅ Found at: $JAR_PATH"
        
        TARGET_DIR="Client/TeamTalkAndroid/libs"
        mkdir -p $TARGET_DIR
        cp "$JAR_PATH" "$TARGET_DIR/TeamTalk5.jar"
        
        # --- FIX DESUGAR ERROR: STRIP JAVA 9+ METADATA ---
        echo "🧹 Cleaning incompatible Java 9+ metadata from JAR..."
        FINAL_JAR="$TARGET_DIR/TeamTalk5.jar"
        
        # Hapus module-info.class (biang kerok Java 9+)
        zip -d "$FINAL_JAR" "module-info.class" || true
        
        # Hapus folder META-INF/versions (Multi-Release Jar support)
        zip -d "$FINAL_JAR" "META-INF/versions/*" || true
        
        echo "✨ JAR cleaned successfully!"
        
        # Fix struktur folder legacy (symlink app)
        if [ -d "Client/TeamTalkAndroid/src/main" ] && [ ! -d "Client/TeamTalkAndroid/app" ]; then
          echo "🔧 Creating 'app' symlink..."
          cd Client/TeamTalkAndroid
          mkdir -p app
          ln -sf ../src app/src
          ln -sf ../libs app/libs
          if [ -f "../build.gradle" ] && [ ! -f "app/build.gradle" ]; then
             cp ../build.gradle app/build.gradle
          fi
          cd ../..
        fi
        
        ls -lh Client/TeamTalkAndroid/libs/

    # 6. Disable Jetifier & Create local.properties
    - name: Configure Build Environment
      run: |
        echo "android.enableJetifier=false" >> Client/TeamTalkAndroid/gradle.properties
        echo "sdk.dir=${{ env.ANDROID_HOME }}" > Client/TeamTalkAndroid/local.properties

    # 7. Build APK
    - name: Build Debug APK
      working-directory: ./Client/TeamTalkAndroid 
      run: |
        chmod +x gradlew
        ./gradlew clean --no-daemon
        ./gradlew assembleDebug --stacktrace --info --no-daemon

    # 8. Upload Artifact
    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk5-Legacy-CleanedJAR
        path: |
          Client/TeamTalkAndroid/build/outputs/apk/debug/*.apk
          Client/TeamTalkAndroid/build/apk/*.apk
          Client/TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
