buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.4'
    }
}

apply plugin: 'com.android.application'

android {
    buildToolsVersion '30.0.3'
    compileSdkVersion 30

    defaultConfig {
        applicationId "dk.bearware.gui"
        minSdkVersion 21
        targetSdkVersion 30

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'teamtalk-proguard-rules.txt'
        }
    }

    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    // SKIP TASK checkDebugAarMetadata YANG REWEL
    tasks.whenTaskAdded { task ->
        if (task.name == 'checkDebugAarMetadata') {
            task.enabled = false
        }
    }
}

dependencies {
    // --- LIBRARY VERSI COMPATIBLE DENGAN SDK 30 ---
    implementation 'com.google.code.gson:gson:2.8.9'
    
    // Gunakan versi AndroidX yang stabil & compatible dengan compileSdk 30
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'      // Turun dari 1.4.2
    implementation 'androidx.core:core:1.6.0'                // Turun dari 1.8.0
    implementation 'androidx.fragment:fragment:1.3.6'        // Turun dari 1.5.1
    implementation 'androidx.media:media:1.4.3'              // Tetap sama (udah compatible)
    implementation 'androidx.preference:preference:1.1.1'    // Turun dari 1.2.0 (versi original project)
    implementation 'androidx.viewpager:viewpager:1.0.0'      // Tetap sama
    implementation 'com.google.android.material:material:1.4.0' // Turun dari 1.6.1
    
    // ConstraintLayout AndroidX (bukan Support Library!)
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0' // Turun dari 2.1.4

    // --- TEAMTALK5.JAR (Bypass Jetifier) ---
    compileOnly files('libs/TeamTalk5.jar')
    runtimeOnly files('libs/TeamTalk5.jar')

    // --- TESTING ---
    testImplementation 'junit:junit:4.13.2'
    testImplementation files('libs/TeamTalk5Test.jar')
    
    androidTestImplementation 'androidx.test:core:1.4.0'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test:rules:1.4.0'
    androidTestImplementation files('libs/TeamTalk5Test.jar')
}
