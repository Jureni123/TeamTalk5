name: TeamTalk5 Legacy Android Build

on: 
  workflow_dispatch: # Hanya jalan kalau kamu klik tombol manual

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true 

    # 1. Setup Java 11 (Wajib untuk project era 2016)
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 2. Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 29
        build-tools: 29.0.3

    # 3. Verifikasi & Fix Struktur Folder Legacy
    - name: Check & Fix Project Structure
      run: |
        echo "=== Mengecek struktur folder ==="
        ls -R Client/TeamTalkAndroid/ || echo "Folder Client/TeamTalkAndroid tidak ditemukan!"
        
        # Cek keberadaan file native (.so) dan library (.jar)
        echo "=== Mencari file binary ==="
        find . -name "*.so" -o -name "TeamTalk*.jar" | head -20
        
        # FIX KRUSIAL: Repo 2016 sering tidak punya folder 'app'
        # Gradle modern biasanya mencari source di dalam folder 'app'
        if [ -d "Client/TeamTalkAndroid/src/main" ] && [ ! -d "Client/TeamTalkAndroid/app" ]; then
          echo "️ Terdeteksi struktur legacy tanpa folder 'app'. Membuat symlink..."
          cd Client/TeamTalkAndroid
          mkdir -p app
          ln -s ../src app/src 2>/dev/null || true
          ln -s ../libs app/libs 2>/dev/null || true
          # Jika build.gradle ada di root project android, link juga
          if [ -f "../build.gradle" ] && [ ! -f "app/build.gradle" ]; then
             cp ../build.gradle app/build.gradle 2>/dev/null || true
          fi
          cd ../..
        fi

    # 4. Generate local.properties (Wajib agar Gradle tahu lokasi SDK)
    - name: Create local.properties
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > Client/TeamTalkAndroid/local.properties
        echo "ndk.dir=${ANDROID_NDK_HOME}" >> Client/TeamTalkAndroid/local.properties

    # 5. Build APK
    - name: Build Debug APK
      working-directory: ./Client/TeamTalkAndroid 
      run: |
        chmod +x gradlew
        
        # Coba build dengan info lengkap biar kalau error kita tahu penyebabnya
        ./gradlew assembleDebug --stacktrace --info

    # 6. Upload APK (Cari di semua kemungkinan path output)
    - name: Upload APK Artifact
      if: always() # Tetap upload meskipun build gagal (untuk keperluan debug)
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk5-Legacy-APK
        path: |
          Client/TeamTalkAndroid/build/outputs/apk/debug/*.apk
          Client/TeamTalkAndroid/build/apk/*.apk
          Client/TeamTalkAndroid/bin/*.apk
          Client/TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
