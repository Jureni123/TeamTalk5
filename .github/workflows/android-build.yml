name: TeamTalk5 Legacy Build (Universal JAR Search)

on: 
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true 

    # 2. Setup Java 17 (WAJIB untuk sdkmanager)
    - name: Set up JDK 17 for SDK Tools
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Setup Android SDK MANUAL
    - name: Install Android SDK Manually
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true
        
        sdkmanager --sdk_root=$ANDROID_HOME \
          "platform-tools" \
          "platforms;android-29" \
          "build-tools;29.0.3"
          
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    # 4. SWITCH KE JAVA 11
    - name: Switch to JDK 11 for Legacy Compilation
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 5. UNIVERSAL SEARCH: CARI JAR DI MANA SAJA & COPY KE TARGET
    - name: Find & Copy TeamTalk5.jar to Target
      run: |
        echo " Searching for TeamTalk5.jar in ENTIRE repository..."
        
        # Cari file JAR di mana saja (case-insensitive)
        JAR_PATH=$(find . -iname "TeamTalk5.jar" -type f | head -n 1)
        
        if [ -z "$JAR_PATH" ]; then
          echo "❌ FATAL ERROR: TeamTalk5.jar NOT FOUND anywhere!"
          echo "Please make sure you uploaded TeamTalk5.jar to Client/TeamTalkAndroid/libs/"
          exit 1
        else
          echo "✅ FOUND TeamTalk5.jar at: $JAR_PATH"
          
          # Target folder yang diharapkan Gradle
          TARGET_DIR="Client/TeamTalkAndroid/libs"
          mkdir -p $TARGET_DIR
          
          # Copy ke target jika belum di sana
          if [[ "$JAR_PATH" != *"$TARGET_DIR/TeamTalk5.jar"* ]]; then
            echo "📦 Copying JAR to target location: $TARGET_DIR/"
            cp "$JAR_PATH" "$TARGET_DIR/TeamTalk5.jar"
          else
            echo "✨ JAR already in correct location!"
          fi
        fi
        
        # Fix struktur folder legacy (symlink app)
        if [ -d "Client/TeamTalkAndroid/src/main" ] && [ ! -d "Client/TeamTalkAndroid/app" ]; then
          echo "🔧 Creating 'app' symlink for legacy structure..."
          cd Client/TeamTalkAndroid
          mkdir -p app
          ln -sf ../src app/src
          ln -sf ../libs app/libs
          if [ -f "../build.gradle" ] && [ ! -f "app/build.gradle" ]; then
             cp ../build.gradle app/build.gradle
          fi
          cd ../..
        fi
        
        # Verifikasi akhir
        echo "=== Final Check: Contents of libs folder ==="
        ls -lh Client/TeamTalkAndroid/libs/

    # 6. Disable Jetifier & Create local.properties
    - name: Configure Build Environment
      run: |
        echo "android.enableJetifier=false" >> Client/TeamTalkAndroid/gradle.properties
        echo "sdk.dir=${{ env.ANDROID_HOME }}" > Client/TeamTalkAndroid/local.properties

    # 7. Build APK
    - name: Build Debug APK
      working-directory: ./Client/TeamTalkAndroid 
      run: |
        chmod +x gradlew
        ./gradlew clean --no-daemon
        ./gradlew assembleDebug --stacktrace --info --no-daemon

    # 8. Upload Artifact
    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk5-Legacy-UniversalSearch
        path: |
          Client/TeamTalkAndroid/build/outputs/apk/debug/*.apk
          Client/TeamTalkAndroid/build/apk/*.apk
          Client/TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
