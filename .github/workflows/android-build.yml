name: TeamTalk5 Legacy Build (Direct Clean Fix)

on: 
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true 

    # 2. Setup Java 17 (WAJIB untuk sdkmanager)
    - name: Set up JDK 17 for SDK Tools
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Install System Tools & Android SDK
    - name: Install Tools & Android SDK
      run: |
        sudo apt-get update && sudo apt-get install -y zip unzip
        
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-29" "build-tools;29.0.3"
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    # 4. SWITCH KE JAVA 11
    - name: Switch to JDK 11 for Legacy Compilation
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 5. DIRECT CLEANING (NO COPY NEEDED)
    - name: Aggressively Clean TeamTalk5.jar In-Place
      run: |
        TARGET_JAR="Client/TeamTalkAndroid/libs/TeamTalk5.jar"
        
        if [ ! -f "$TARGET_JAR" ]; then
          echo "❌ FATAL: TeamTalk5.jar NOT FOUND at expected location!"
          exit 1
        fi
        
        echo "✅ Found TeamTalk5.jar at: $TARGET_JAR"
        echo "🧹 Starting aggressive in-place cleaning..."
        
        # 1. Hapus module-info.class
        echo "   - Removing module-info.class..."
        zip -d "$TARGET_JAR" "module-info.class" || echo "   (Not found, skipping)"
        
        # 2. Hapus META-INF/versions/*
        echo "   - Removing META-INF/versions/*..."
        zip -d "$TARGET_JAR" "META-INF/versions/*" || echo "   (Not found, skipping)"
        
        # 3. Hapus META-INF/module-info.class
        echo "   - Removing META-INF/module-info.class..."
        zip -d "$TARGET_JAR" "META-INF/module-info.class" || echo "   (Not found, skipping)"
        
        echo "✨ Cleaning complete! JAR is now compatible with legacy D8."
        
        # Fix struktur folder legacy (symlink app)
        if [ -d "Client/TeamTalkAndroid/src/main" ] && [ ! -d "Client/TeamTalkAndroid/app" ]; then
          echo "🔧 Creating 'app' symlink for legacy structure..."
          cd Client/TeamTalkAndroid
          mkdir -p app
          ln -sf ../src app/src
          ln -sf ../libs app/libs
          if [ -f "../build.gradle" ] && [ ! -f "app/build.gradle" ]; then
             cp ../build.gradle app/build.gradle
          fi
          cd ../..
        fi
        
        ls -lh Client/TeamTalkAndroid/libs/

    # 6. Configure Environment
    - name: Configure Build Environment
      run: |
        echo "android.enableJetifier=false" >> Client/TeamTalkAndroid/gradle.properties
        echo "sdk.dir=${{ env.ANDROID_HOME }}" > Client/TeamTalkAndroid/local.properties

    # 7. Build APK
    - name: Build Debug APK
      working-directory: ./Client/TeamTalkAndroid 
      run: |
        chmod +x gradlew
        ./gradlew clean --no-daemon
        ./gradlew assembleDebug --stacktrace --info --no-daemon

    # 8. Upload Artifact
    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk5-Legacy-DirectClean
        path: |
          Client/TeamTalkAndroid/build/outputs/apk/debug/*.apk
          Client/TeamTalkAndroid/build/apk/*.apk
          Client/TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
