name: TeamTalk5 Legacy Android Build (Fixed SDK)

on: 
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true 

    # 1. Setup Java 11 (Wajib untuk project era 2016)
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 2. Setup Android SDK MANUAL (Anti-Error)
    - name: Setup Android SDK Manually
      run: |
        # Install cmdline-tools via apt (lebih stabil daripada action pihak ketiga)
        sudo apt-get update
        sudo apt-get install -y wget unzip
        
        # Download & Setup Command Line Tools
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Install komponen yang dibutuhkan (API 29 cocok buat repo 2016)
        yes | sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-29" "build-tools;29.0.3"
        
        # Set environment variables biar Gradle bisa baca
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    # 3. Verifikasi & Fix Struktur Folder Legacy
    - name: Check & Fix Project Structure
      run: |
        echo "=== Mengecek struktur folder ==="
        ls -R Client/TeamTalkAndroid/ || echo "Folder Client/TeamTalkAndroid tidak ditemukan!"
        
        # Cek keberadaan file native (.so) dan library (.jar)
        echo "=== Mencari file binary ==="
        find . -name "*.so" -o -name "TeamTalk*.jar" | head -20
        
        # FIX KRUSIAL: Repo 2016 sering tidak punya folder 'app'
        if [ -d "Client/TeamTalkAndroid/src/main" ] && [ ! -d "Client/TeamTalkAndroid/app" ]; then
          echo "⚠️ Terdeteksi struktur legacy tanpa folder 'app'. Membuat symlink..."
          cd Client/TeamTalkAndroid
          mkdir -p app
          ln -s ../src app/src 2>/dev/null || true
          ln -s ../libs app/libs 2>/dev/null || true
          if [ -f "../build.gradle" ] && [ ! -f "app/build.gradle" ]; then
             cp ../build.gradle app/build.gradle 2>/dev/null || true
          fi
          cd ../..
        fi

    # 4. Generate local.properties (Wajib agar Gradle tahu lokasi SDK)
    - name: Create local.properties
      run: |
        echo "sdk.dir=${{ env.ANDROID_HOME }}" > Client/TeamTalkAndroid/local.properties

    # 5. Build APK
    - name: Build Debug APK
      working-directory: ./Client/TeamTalkAndroid 
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --info

    # 6. Upload APK
    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk5-Legacy-APK-Fixed
        path: |
          Client/TeamTalkAndroid/build/outputs/apk/debug/*.apk
          Client/TeamTalkAndroid/build/apk/*.apk
          Client/TeamTalkAndroid/bin/*.apk
          Client/TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
