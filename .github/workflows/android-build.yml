name: TeamTalk5 Legacy Build (Final Desugar Fix)

on: 
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true 

    # 2. Setup Java 17 (WAJIB untuk sdkmanager)
    - name: Set up JDK 17 for SDK Tools
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Install System Tools & Android SDK
    - name: Install Tools & Android SDK
      run: |
        # Install zip/unzip tools yang wajib buat clean JAR
        sudo apt-get update && sudo apt-get install -y zip unzip
        
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-29" "build-tools;29.0.3"
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    # 4. SWITCH KE JAVA 11
    - name: Switch to JDK 11 for Legacy Compilation
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 5. AGGRESSIVE JAR CLEANING (PASTIKAN ZIP TOOL TERPASANG)
    - name: Find, Copy & Aggressively Clean TeamTalk5.jar
      run: |
        echo "🔍 Searching for TeamTalk5.jar..."
        JAR_PATH=$(find . -iname "TeamTalk5.jar" -type f | head -n 1)
        
        if [ -z "$JAR_PATH" ]; then
          echo "❌ FATAL: TeamTalk5.jar NOT FOUND!"
          exit 1
        fi
        
        echo "✅ Found at: $JAR_PATH"
        
        TARGET_DIR="Client/TeamTalkAndroid/libs"
        mkdir -p $TARGET_DIR
        cp "$JAR_PATH" "$TARGET_DIR/TeamTalk5.jar"
        
        # --- CLEANING PROCESS ---
        FINAL_JAR="$TARGET_DIR/TeamTalk5.jar"
        echo " Starting aggressive cleaning on: $FINAL_JAR"
        
        # 1. Hapus module-info.class
        echo "   - Removing module-info.class..."
        zip -d "$FINAL_JAR" "module-info.class" || echo "   (module-info not found, skipping)"
        
        # 2. Hapus seluruh folder META-INF/versions
        echo "   - Removing META-INF/versions/*..."
        zip -d "$FINAL_JAR" "META-INF/versions/*" || echo "   (META-INF/versions not found, skipping)"
        
        # 3. Hapus META-INF/module-info.class (kadang ada di sini)
        echo "   - Removing META-INF/module-info.class..."
        zip -d "$FINAL_JAR" "META-INF/module-info.class" || echo "   (META-INF/module-info not found, skipping)"
        
        echo "✨ Cleaning complete!"
        
        # Fix struktur folder legacy
        if [ -d "Client/TeamTalkAndroid/src/main" ] && [ ! -d "Client/TeamTalkAndroid/app" ]; then
          echo "🔧 Creating 'app' symlink..."
          cd Client/TeamTalkAndroid
          mkdir -p app
          ln -sf ../src app/src
          ln -sf ../libs app/libs
          if [ -f "../build.gradle" ] && [ ! -f "app/build.gradle" ]; then
             cp ../build.gradle app/build.gradle
          fi
          cd ../..
        fi
        
        ls -lh Client/TeamTalkAndroid/libs/

    # 6. Configure Environment
    - name: Configure Build Environment
      run: |
        echo "android.enableJetifier=false" >> Client/TeamTalkAndroid/gradle.properties
        echo "sdk.dir=${{ env.ANDROID_HOME }}" > Client/TeamTalkAndroid/local.properties

    # 7. Build APK
    - name: Build Debug APK
      working-directory: ./Client/TeamTalkAndroid 
      run: |
        chmod +x gradlew
        ./gradlew clean --no-daemon
        ./gradlew assembleDebug --stacktrace --info --no-daemon

    # 8. Upload Artifact
    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk5-Legacy-FinalDesugarFix
        path: |
          Client/TeamTalkAndroid/build/outputs/apk/debug/*.apk
          Client/TeamTalkAndroid/build/apk/*.apk
          Client/TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
