name: TeamTalk5 Legacy Build (Bytecode Downgrader Fix)

on: 
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true 

    # 2. Setup Java 17 (WAJIB untuk sdkmanager & python)
    - name: Set up JDK 17 for SDK Tools
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Install Tools, Python & Android SDK
    - name: Install Tools, Python & Android SDK
      run: |
        sudo apt-get update && sudo apt-get install -y zip unzip python3 python3-pip
        
        # Install ASM library buat patch bytecode
        pip3 install asm-python || pip3 install pyasm || echo "ASM not available via pip, using manual method"
        
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-29" "build-tools;29.0.3"
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    # 4. SWITCH KE JAVA 11
    - name: Switch to JDK 11 for Legacy Compilation
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 5. BYTECODE DOWNGRADER (PATCH JAVA VERSION KE 8)
    - name: Downgrade TeamTalk5.jar Bytecode to Java 8
      run: |
        TARGET_JAR="Client/TeamTalkAndroid/libs/TeamTalk5.jar"
        
        if [ ! -f "$TARGET_JAR" ]; then
          echo "❌ FATAL: TeamTalk5.jar NOT FOUND!"
          exit 1
        fi
        
        echo "✅ Found TeamTalk5.jar. Starting Bytecode Downgrade..."
        
        # Extract JAR ke folder temporary
        TEMP_DIR=$(mktemp -d)
        cd "$TEMP_DIR"
        jar xf "$OLDPWD/$TARGET_JAR"
        
        # Hapus metadata Java 9+ dulu
        rm -rf META-INF/versions/ module-info.class META-INF/module-info.class 2>/dev/null || true
        
        # PATCH BYTECODE: Ubah major version semua .class file ke 52 (Java 8)
        echo " Patching all .class files to Java 8 (major version 52)..."
        find . -name "*.class" -type f | while read -r class_file; do
          # Baca 4 byte pertama (magic + minor version), lalu ubah byte ke-7 (major version) jadi 0x34 (52 decimal = Java 8)
          python3 -c "
import sys
with open('$class_file', 'rb') as f:
    data = bytearray(f.read())
if len(data) >= 8 and data[0:4] == b'\xca\xfe\xba\xbe':
    data[7] = 0x34  # Set major version to 52 (Java 8)
    with open('$class_file', 'wb') as f:
        f.write(data)
" 2>/dev/null || echo "   Failed to patch $class_file (skipping)"
        done
        
        # Repack JAR
        echo " Repacking JAR..."
        jar cf "$OLDPWD/$TARGET_JAR" .
        
        echo "✨ Bytecode downgrade complete! All classes now target Java 8."
        
        # Fix struktur folder legacy
        cd "$OLDPWD"
        if [ -d "Client/TeamTalkAndroid/src/main" ] && [ ! -d "Client/TeamTalkAndroid/app" ]; then
          echo " Creating 'app' symlink..."
          cd Client/TeamTalkAndroid
          mkdir -p app
          ln -sf ../src app/src
          ln -sf ../libs app/libs
          if [ -f "../build.gradle" ] && [ ! -f "app/build.gradle" ]; then
             cp ../build.gradle app/build.gradle
          fi
          cd ../..
        fi

    # 6. Configure Environment
    - name: Configure Build Environment
      run: |
        echo "android.enableJetifier=false" >> Client/TeamTalkAndroid/gradle.properties
        echo "sdk.dir=${{ env.ANDROID_HOME }}" > Client/TeamTalkAndroid/local.properties

    # 7. Build APK
    - name: Build Debug APK
      working-directory: ./Client/TeamTalkAndroid 
      run: |
        chmod +x gradlew
        ./gradlew clean --no-daemon
        ./gradlew assembleDebug --stacktrace --info --no-daemon

    # 8. Upload Artifact
    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk5-Legacy-BytecodeDowngraded
        path: |
          Client/TeamTalkAndroid/build/outputs/apk/debug/*.apk
          Client/TeamTalkAndroid/build/apk/*.apk
          Client/TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
