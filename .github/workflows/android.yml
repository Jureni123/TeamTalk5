name: Build TeamTalk Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch: # Agar bisa dijalankan manual dari tab Actions

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Setup Java & Android SDK
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 2. Install Dependencies untuk Compile C++ Library
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo make -C TeamTalk5/Build depend-ubuntu22 || true
        
    # 3. Build Native Library (JNI) untuk SEMUA arsitektur sekaligus
    - name: Build TeamTalk JNI Libraries
      working-directory: TeamTalk5/Build
      run: |
        # Perintah ini akan mengompilasi arm64, armeabi, x86, x86_64 sekaligus
        # Hasilnya otomatis masuk ke Library/TeamTalkJNI/libs/
        make android-all

    # 4. Pindahkan Library ke Project Android Studio
    - name: Copy JNI Libraries to Android Project
      run: |
        # Buat folder jniLibs jika belum ada
        mkdir -p TeamTalkAndroid/app/src/main/jniLibs
        
        # Salin semua .so hasil build ke folder yang benar
        cp -r TeamTalk5/Library/TeamTalkJNI/libs/arm64-v8a TeamTalkAndroid/app/src/main/jniLibs/
        cp -r TeamTalk5/Library/TeamTalkJNI/libs/armeabi-v7a TeamTalkAndroid/app/src/main/jniLibs/
        cp -r TeamTalk5/Library/TeamTalkJNI/libs/x86 TeamTalkAndroid/app/src/main/jniLibs/
        cp -r TeamTalk5/Library/TeamTalkJNI/libs/x86_64 TeamTalkAndroid/app/src/main/jniLibs/
        
        # Salin Java Wrapper JAR
        mkdir -p TeamTalkAndroid/app/libs
        cp TeamTalk5/Library/TeamTalkJNI/libs/TeamTalk5.jar TeamTalkAndroid/app/libs/ || true

    # 5. Buat local.properties otomatis (PENTING karena tidak ada PC)
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > TeamTalkAndroid/local.properties

    # 6. Build APK Debug
    - name: Build Debug APK
      working-directory: TeamTalkAndroid
      run: ./gradlew assembleDebug --stacktrace

    # 7. Upload APK sebagai Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk-Android-Debug-APK
        path: TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
