name: Build TeamTalk Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch: 

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Setup Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 2. Install Android SDK & NDK Manual
    - name: Setup Android SDK & NDK
      run: |
        sudo apt-get update && sudo apt-get install -y wget unzip
        
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    # 3. Install System Dependencies
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git pkg-config libssl-dev libopus-dev libspeexdsp-dev libavcodec-dev libavformat-dev libswscale-dev libavutil-dev libvpx-dev
        # Jalankan script dependensi dari root folder (sesuai struktur repo kamu)
        make -C Build depend-ubuntu22 || echo "Script dependensi tidak ditemukan, lanjut compile..."

    # 4. Build Native Library (PERBAIKAN PATH DI SINI)
    - name: Build TeamTalk JNI Libraries
      working-directory: Build  # <--- DIUBAH: Langsung ke folder Build di root
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
        make android-all

    # 5. Pindahkan Library ke Project Android
    - name: Copy JNI Libraries to Android Project
      run: |
        # Pastikan folder tujuan ada
        mkdir -p TeamTalkAndroid/app/src/main/jniLibs
        mkdir -p TeamTalkAndroid/app/libs
        
        # Salin file .so
        cp -r Library/TeamTalkJNI/libs/arm64-v8a TeamTalkAndroid/app/src/main/jniLibs/ || true
        cp -r Library/TeamTalkJNI/libs/armeabi-v7a TeamTalkAndroid/app/src/main/jniLibs/ || true
        cp -r Library/TeamTalkJNI/libs/x86 TeamTalkAndroid/app/src/main/jniLibs/ || true
        cp -r Library/TeamTalkJNI/libs/x86_64 TeamTalkAndroid/app/src/main/jniLibs/ || true
        
        # Salin file .jar
        cp Library/TeamTalkJNI/libs/TeamTalk5.jar TeamTalkAndroid/app/libs/ || true

    # 6. Buat local.properties
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > TeamTalkAndroid/local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> TeamTalkAndroid/local.properties

    # 7. Build APK
    - name: Build Debug APK
      working-directory: TeamTalkAndroid
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    # 8. Upload APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk-Android-Debug-APK
        path: TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
