name: Build TeamTalk Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch: 

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Setup Java (Wajib untuk Android)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 2. Install Android SDK & NDK secara Manual (Pengganti action yang error)
    - name: Setup Android SDK & NDK
      run: |
        # Install command line tools dasar jika belum ada
        sudo apt-get update && sudo apt-get install -y wget unzip
        
        # Set lokasi Android SDK
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        
        # Download Command Line Tools terbaru
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        # Set PATH agar sdkmanager bisa dipanggil
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Install komponen yang dibutuhkan (SDK Platform, Build Tools, NDK, CMake)
        yes | sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
        
        # Simpan path ke environment GitHub untuk step selanjutnya
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    # 3. Install Dependencies Sistem untuk Compile C++ TeamTalk
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        # Install dependensi umum untuk compile C++ di Ubuntu 22.04
        sudo apt-get install -y build-essential cmake git pkg-config libssl-dev libopus-dev libspeexdsp-dev libavcodec-dev libavformat-dev libswscale-dev libavutil-dev libvpx-dev
        
        # Coba jalankan script dependensi TeamTalk jika ada (abaikan error jika gagal)
        cd TeamTalk5 && make -C Build depend-ubuntu22 || echo "Script depend-ubuntu22 tidak ditemukan, lanjut..."

    # 4. Build Native Library (JNI)
    - name: Build TeamTalk JNI Libraries
      working-directory: TeamTalk5/Build
      run: |
        # Pastikan NDK terlihat oleh sistem build
        export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
        # Jalankan build untuk semua arsitektur
        make android-all

    # 5. Pindahkan Library ke Project Android
    - name: Copy JNI Libraries to Android Project
      run: |
        mkdir -p TeamTalkAndroid/app/src/main/jniLibs
        cp -r TeamTalk5/Library/TeamTalkJNI/libs/arm64-v8a TeamTalkAndroid/app/src/main/jniLibs/ || true
        cp -r TeamTalk5/Library/TeamTalkJNI/libs/armeabi-v7a TeamTalkAndroid/app/src/main/jniLibs/ || true
        cp -r TeamTalk5/Library/TeamTalkJNI/libs/x86 TeamTalkAndroid/app/src/main/jniLibs/ || true
        cp -r TeamTalk5/Library/TeamTalkJNI/libs/x86_64 TeamTalkAndroid/app/src/main/jniLibs/ || true
        
        mkdir -p TeamTalkAndroid/app/libs
        cp TeamTalk5/Library/TeamTalkJNI/libs/TeamTalk5.jar TeamTalkAndroid/app/libs/ || true

    # 6. Buat local.properties otomatis
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > TeamTalkAndroid/local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> TeamTalkAndroid/local.properties

    # 7. Berikan izin execute pada gradlew dan Build APK
    - name: Build Debug APK
      working-directory: TeamTalkAndroid
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    # 8. Upload APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk-Android-Debug-APK
        path: TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
