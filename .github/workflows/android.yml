name: TeamTalk5 Legacy Direct Build (No Native Compile)

on: [workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true # Penting! Kadang library disimpan sebagai submodule git

    # 1. Setup Java 11 (Lebih aman untuk project 2016-era)
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 2. Setup Android SDK (Menggunakan action resmi biar path otomatis benar)
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 29
        build-tools: 29.0.3
        # Kita tidak install NDK disini karena asumsinya .so sudah pre-compiled

    # 3. Verifikasi File Binary (PENTING!)
    - name: Check Pre-built Binaries
      run: |
        echo "=== Mengecek keberadaan file .so dan .jar ==="
        # Cek di berbagai lokasi umum repo lama
        find . -name "*.so" || echo "Tidak ditemukan file .so"
        find . -name "TeamTalk*.jar" || echo "Tidak ditemukan file .jar"
        
        # Tampilkan struktur folder Client
        ls -R Client/TeamTalkAndroid/

    # 4. Build APK Langsung (Tanpa make android-all)
    - name: Build Debug APK
      working-directory: ./Client/TeamTalkAndroid 
      run: |
        chmod +x gradlew
        
        # Jika repo 2016 strukturnya beda (misal tidak pakai folder 'app'), 
        # Gradle mungkin butuh parameter khusus. Tapi coba default dulu.
        ./gradlew assembleDebug --stacktrace --info

    # 5. Upload APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk5-Legacy-Direct-Build
        # Path output Gradle lama kadang beda, kita cari semua kemungkinan
        path: |
          Client/TeamTalkAndroid/build/outputs/apk/debug/*.apk
          Client/TeamTalkAndroid/build/apk/*.apk
          Client/TeamTalkAndroid/bin/*.apk
