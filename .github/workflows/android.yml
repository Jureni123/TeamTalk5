name: TeamTalk5 Legacy Direct Build (Fixed)

on: [workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true # Tetap aktifkan, siapa tau ada lib eksternal

    # 1. Setup Java 11 (Wajib untuk project lama)
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 2. Setup Android SDK (Pakai action resmi)
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 29
        build-tools: 29.0.3

    # 3. Verifikasi & Fix Struktur Folder (PERBAIKAN UTAMA)
    - name: Check & Fix Project Structure
      run: |
        echo "=== Mengecek struktur folder ==="
        ls -R Client/TeamTalkAndroid/
        
        # Cek apakah ada file .so atau .jar
        find . -name "*.so" -o -name "TeamTalk*.jar" | head -20
        
        # FIX KRUSIAL: Repo 2016 kadang strukturnya 'src/main' langsung di root project Android
        # Bukan di dalam folder 'app'. Kita cek dulu.
        if [ -d "Client/TeamTalkAndroid/src/main" ] && [ ! -d "Client/TeamTalkAndroid/app" ]; then
          echo "Deteksi: Struktur legacy tanpa folder 'app'. Membuat symlink..."
          cd Client/TeamTalkAndroid
          mkdir -p app
          ln -s ../src app/src 2>/dev/null || true
          ln -s ../libs app/libs 2>/dev/null || true
          ln -s ../build.gradle app/build.gradle 2>/dev/null || true
          cd ../..
        fi

    # 4. Generate local.properties (Seringkali hilang di repo lama)
    - name: Create local.properties
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > Client/TeamTalkAndroid/local.properties
        echo "ndk.dir=${ANDROID_NDK_HOME}" >> Client/TeamTalkAndroid/local.properties

    # 5. Build APK dengan Toleransi Error
    - name: Build Debug APK
      working-directory: ./Client/TeamTalkAndroid 
      run: |
        chmod +x gradlew
        
        # Coba build. Jika gagal karena dependency, tampilkan info lengkap
        ./gradlew assembleDebug --stacktrace --info || {
          echo "BUILD GAGAL. Mencoba fallback..."
          # Kadang repo lama butuh flag khusus
          ./gradlew assembleDebug --no-daemon --stacktrace
        }

    # 6. Upload APK (Cari di semua lokasi mungkin)
    - name: Upload APK Artifact
      if: always() # Upload bahkan kalau build gagal (buat debug)
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk5-Legacy-Direct-Build
        path: |
          Client/TeamTalkAndroid/build/outputs/apk/debug/*.apk
          Client/TeamTalkAndroid/build/apk/*.apk
          Client/TeamTalkAndroid/bin/*.apk
          Client/TeamTalkAndroid/app/build/outputs/apk/debug/*.apk
